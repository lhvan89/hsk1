<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Chủ đề 6: Mua sắm</title>
    <script src="js/06-mau-cau-mua-sam.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --secondary-color: #0ea5e9;
            --bg-gradient: linear-gradient(135deg, #f0f7ff 0%, #e0f2fe 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        /* Đã sửa lỗi dấu - thành * */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #1d1d1f;
            line-height: 1.6;
            padding: 20px;
        }

        /* Khung tổng thể */
        .container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
        }

        /* Header phía trên */
        header {
            text-align: center;
            padding: 28px 20px;
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            color: #ffffff;
            border-radius: 20px 20px 0 0;
        }

        header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        header p {
            color: #e0f2fe;
            font-size: 0.98rem;
        }

        /* Phần nội dung chính */
        main {
            background: #ffffff;
            padding: 24px;
            border-radius: 0 0 20px 20px;
            min-height: 200px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .stats {
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            font-size: 0.92rem;
            color: var(--primary-color);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        }

        .word-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(410px, 1fr));
            gap: 14px;
        }

        .word-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 16px 18px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
        }

        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.12);
            border-color: var(--primary-border);
        }

        .word-card.playing {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .index {
            font-size: 11px;
            font-weight: 600;
            color: #8e8e93;
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        .word-content .zh {
            font-size: 1.38rem;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .word-content .pinyin {
            font-size: 0.96rem;
            color: #6e6e73;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .word-content .vi {
            font-size: 0.95rem;
            color: #475569;
        }

        .audio-btn {
            background: var(--primary-light);
            border: 1.5px solid var(--primary-border);
            color: var(--primary-color);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .audio-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .audio-btn:active {
            transform: scale(0.96);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .word-list {
                grid-template-columns: 1fr;
            }
            body {
                padding: 12px;
            }

            .container {
                border-radius: 16px;
            }

            header {
                padding: 24px 16px;
                border-radius: 16px 16px 0 0;
            }

            header h1 {
                font-size: 1.4rem;
            }

            header p {
                font-size: 0.88rem;
            }

            main {
                padding: 16px;
                border-radius: 0 0 16px 16px;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 0;
                width: 100%;
            }

            .stats {
                min-height: 42px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HSK 1 - Chủ đề 6: Mua sắm</h1>
        <p>100 mẫu câu giao tiếp tiếng Trung cơ bản kèm Pinyin, nghĩa tiếng Việt và phát âm</p>
    </header>

    <main>
        <div class="controls">
            <input type="text" id="search-input" class="search-box" placeholder="Tìm kiếm tiếng Trung, Pinyin hoặc nghĩa tiếng Việt...">
            <div class="stats" id="word-count">Hiển thị: 100 / 100 câu</div>
        </div>

        <div id="word-container" class="word-list"></div>
    </main>
</div>

<script>
    // Chuyển đổi thành mảng Object chuẩn cấu trúc
    const ALL_WORDS = MAU_CAU_MUA_SAM.map(([zh, pinyin, vi, audioUrl], index) => ({
        id: index + 1,
        zh,
        pinyin,
        vi,
        audioUrl: `audio/${audioUrl}`
    }));

    let currentAudio = null;

    // Hàm phát âm thanh kèm hiệu ứng highlight thẻ đang đọc
    function playAudio(audioUrl, cardElement) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        document.querySelectorAll('.word-card.playing').forEach(el => el.classList.remove('playing'));

        if (cardElement) {
            cardElement.classList.add('playing');
        }

        currentAudio = new Audio(audioUrl);
        currentAudio.play().catch(err => {
            console.warn("Không tìm thấy hoặc không thể phát file âm thanh:", audioUrl, err);
            // Dự phòng dùng Web Speech API (TTS tiếng Trung) nếu chưa có file mp3 trong thư mục audio/
            if ('speechSynthesis' in window) {
                const textZh = cardElement ? cardElement.querySelector('.zh').textContent : '';
                const utterance = new SpeechSynthesisUtterance(textZh);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.onend = () => cardElement && cardElement.classList.remove('playing');
                window.speechSynthesis.speak(utterance);
            }
        });

        currentAudio.onended = () => {
            if (cardElement) cardElement.classList.remove('playing');
        };
    }

    // Hàm render danh sách từ vựng lên giao diện
    function renderWords(wordsList) {
        const container = document.getElementById('word-container');
        const countEl = document.getElementById('word-count');
        
        countEl.textContent = `Hiển thị: ${wordsList.length} / ${ALL_WORDS.length} câu`;

        if (wordsList.length === 0) {
            container.innerHTML = `<div class="empty-state">Không tìm thấy mẫu câu phù hợp.</div>`;
            return;
        }

        /* Đã loại bỏ thẻ div.word-left thừa ở template */
        container.innerHTML = wordsList.map((word) => `
            <div class="word-card" id="card-${word.id}">
                <div class="word-content">
                    <div class="index">Mẫu câu ${word.id}</div>
                    <div class="zh">${word.zh}</div>
                    <div class="pinyin">${word.pinyin}</div>
                    <div class="vi">${word.vi}</div>
                </div>
                <button class="audio-btn" onclick="playAudio('${word.audioUrl}', document.getElementById('card-${word.id}'))">
                    🔊 Nghe
                </button>
            </div>
        `).join('');
    }

    // Xử lý tìm kiếm nhanh theo chữ Hán, Pinyin hoặc nghĩa tiếng Việt
    document.getElementById('search-input').addEventListener('input', (e) => {
        const keyword = e.target.value.trim().toLowerCase();
        const filtered = ALL_WORDS.filter(item => 
            item.zh.toLowerCase().includes(keyword) ||
            item.pinyin.toLowerCase().includes(keyword) ||
            item.vi.toLowerCase().includes(keyword)
        );
        renderWords(filtered);
    });

    // Khởi tạo giao diện ban đầu
    document.addEventListener('DOMContentLoaded', () => {
        renderWords(ALL_WORDS);
    });
</script>

</body>
</html>
