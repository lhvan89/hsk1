<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1 - Luyện từ vựng</title>
<!-- Nhúng thư viện Hanzi Writer từ CDN -->
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<script src="js/300-words-hsk1.js"></script>
<style>
:root{--blue:#2563eb;--dark:#172554;--muted:#64748b;--bg:#f3f6fc;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#eaf1ff,#f8fafc);font-family:Arial,"Noto Sans",sans-serif;color:#172033;min-height:100vh;display:grid;place-items:center;padding:18px}
.app{width:min(720px,100%);background:#fff;border-radius:24px;box-shadow:0 18px 55px #1e3a8a18;overflow:hidden;align-items: start;}
header{padding:25px 28px 20px;background:linear-gradient(120deg,#1d4ed8,#4f46e5);color:white}
h1{margin:0;font-size:26px} header p{margin:8px 0 0;color:#dbeafe}
.stats{display:flex;gap:10px;padding:16px 25px;background:#f8fafc}
.stat{flex:1;text-align:center;background:white;border:1px solid #e5eaf3;border-radius:13px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stat b{font-size:20px}
main{padding:25px}
.topline{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}
.track{height:8px;background:#e8edf6;border-radius:20px;overflow:hidden;margin-bottom:24px}.fill{height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .25s}
.question{background:#f7f9ff;border:1px solid #e5ebfa;border-radius:18px;padding:27px 18px;text-align:center;margin-bottom:18px}
.tag{display:inline-block;background:#e0eaff;color:#1d4ed8;padding:5px 11px;border-radius:30px;font-size:12px;font-weight:bold}
.meaning{font-size:29px;font-weight:750;margin:15px 0 8px;color:#172554}
.hint{color:var(--muted);font-size:14px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{border:2px solid #e3e8f2;background:white;border-radius:14px;padding:17px 12px;cursor:pointer;text-align:center;transition:.15s;min-height:91px}
.answer:hover:not(:disabled){border-color:#7aa5ff;background:#f5f8ff;transform:translateY(-1px)}
.answer:disabled{cursor:default}
.cn{font-size:27px;font-weight:bold;display:block;color:#172554}.py{font-size:13px;color:var(--muted);display:block;margin-top:5px}
.answer.correct{border-color:#22c55e;background:#f0fdf4}.answer.wrong{border-color:#ef4444;background:#fef2f2}
.feedback{display:none;margin-top:16px;border-radius:13px;padding:14px 16px;line-height:1.6}
.feedback.show{display:block}.feedback.good{background:#f0fdf4;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}
.options-summary{margin-top:8px;font-size:13px;opacity:0.95;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.summary-item{cursor:pointer;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,0.05);transition:background 0.15s;}
.summary-item:hover{background:rgba(0,0,0,0.12);text-decoration:underline;}

/* Modal Popup Styles */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;place-items:center;z-index:1000;padding:15px}
.modal-overlay.show{display:grid}
.modal-content{background:white;border-radius:20px;padding:25px;width:min(420px, 100%);text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2);position:relative;animation:modalIn 0.2s ease-out}
@keyframes modalIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:12px;right:15px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-title{font-size:20px;font-weight:bold;color:var(--dark);margin-bottom:5px}
.modal-py{color:var(--muted);font-size:14px;margin-bottom:15px}
.writer-container{display:flex;justify-content:center;align-items:center;gap:10px;margin:15px 0;min-height:160px;flex-wrap:wrap;}
.writer-box{border:2px dashed #e2e8f0;border-radius:12px;padding:10px;background:#f8fafc;display:inline-block;position:relative;}
.modal-actions{display:flex;gap:8px;justify-content:center;margin-top:15px}
.modal-btn{background:#eef2ff;color:#3730a3;border:none;border-radius:8px;padding:8px 14px;font-weight:bold;font-size:13px;cursor:pointer;transition:background 0.15s}
.modal-btn:hover{background:#e0e7ff}

.actions{display:flex;gap:10px;margin-top:18px}
button.primary,button.secondary{border:0;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:var(--blue);color:white;flex:1}.primary:hover{background:#1d4ed8}.secondary{background:#eef2ff;color:#3730a3}
.primary:disabled{opacity:.45;cursor:not-allowed}
.settings{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;color:var(--muted);font-size:13px}
select{border:1px solid #dbe2ef;border-radius:9px;padding:8px;background:white;color:#334155}
.result{text-align:center;padding:28px 10px;display:none}.result h2{font-size:28px;color:#1e3a8a}.bigscore{font-size:52px;font-weight:800;color:#2563eb}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:0 20px 20px}
@media(max-width:520px){.meaning{font-size:25px}main{padding:18px}.stats{padding:12px}.stat b{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header><h1>🇨🇳 HSK 1 · Luyện từ vựng</h1><p>Nhìn nghĩa tiếng Việt – chọn từ tiếng Trung đúng</p></header>
<div class="stats">
 <div class="stat"><small>Điểm số</small><b id="score">0</b></div>
 <div class="stat"><small>Trả lời đúng</small><b id="right">0</b></div>
 <div class="stat"><small>Chuỗi đúng</small><b id="streak">0</b></div>
</div>
<main>
<div id="game">
 <div class="topline"><span id="counter">Câu 1 / 20</span><span id="accuracy">Chính xác: 0%</span></div>
 <div class="track"><div class="fill" id="progress"></div></div>
 <section class="question"><span class="tag">NGHĨA TIẾNG VIỆT</span><div class="meaning" id="meaning">Tôi</div><div class="hint" id="hint">Hãy chọn từ tiếng Trung tương ứng</div></section>
 <div class="answers" id="answers"></div>
 <div class="feedback" id="feedback"></div>
 <div class="actions"><button class="secondary" id="skip">Bỏ qua</button><button class="primary" id="next" disabled>Câu tiếp theo →</button></div>
 <div class="settings"><label for="count">Số câu mỗi lượt</label><select id="count"><option value="10">10 câu</option><option value="20" selected>20 câu</option><option value="50">50 câu</option><option value="150">Tất cả từ</option></select></div>
</div>
<div class="result" id="result"><div style="font-size:48px">🏆</div><h2>Hoàn thành!</h2><div class="bigscore" id="finalscore">0</div><p id="summary"></p><button class="primary" id="again">Chơi lượt mới ↻</button></div>
</main>
<footer>Ôn tập từ vựng HSK 1 · Học đều mỗi ngày nhé!</footer>
</div>

<!-- Modal Popup Vẽ Chữ Hán -->
<div class="modal-overlay" id="strokeModal">
 <div class="modal-content">
  <button class="modal-close" id="closeModal">&times;</button>
  <div class="modal-title" id="modalHanziTitle"></div>
  <div class="modal-py" id="modalHanziPy"></div>
  <div class="writer-container" id="writerContainer"></div>
  <div class="modal-actions">
   <button class="modal-btn" id="animateBtn">▶ Vẽ lại</button>
   <button class="modal-btn" id="quizBtn">✏️ Tập viết</button>
  </div>
 </div>
</div>

<script>

// Gộp từ trùng, giữ mục đầu tiên để đáp án không bị lặp.
const unique=[...new Map(words.map(w=>[w[0],w])).values()];
let deck=[],index=0,score=0,right=0,streak=0,answered=0,current=null,locked=false, currentOpts=[];
let activeWriters = [];
const $=id=>document.getElementById(id);

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){let n=+$("count").value;deck=shuffle(unique).slice(0,Math.min(n,unique.length));index=score=right=streak=answered=0;$("score").textContent=0;$("right").textContent=0;$("streak").textContent=0;$("game").style.display="block";$("result").style.display="none";render()}
function render(){
 if(index>=deck.length){finish();return}
 locked=false;current=deck[index];$("counter").textContent=`Câu ${index+1} / ${deck.length}`;$("accuracy").textContent=`Chính xác: ${answered?Math.round(right/answered*100):0}%`;$("progress").style.width=(index/deck.length*100)+"%";
 $("meaning").textContent=current[2];$("hint").textContent="Chọn từ tiếng Trung có nghĩa tương ứng";$("feedback").className="feedback";$("feedback").innerHTML="";$("next").disabled=true;
 const wrong=shuffle(unique.filter(w=>w[0]!==current[0])).slice(0,3);currentOpts=shuffle([current,...wrong]);$("answers").innerHTML="";
 currentOpts.forEach(w=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<span class="cn">${w[0]}</span><span class="py">${w[1]}</span>`;b.onclick=()=>choose(b,w);$("answers").appendChild(b)});
}

function getOptionsSummaryHTML() {
 const emojis = ["1️⃣", "2️⃣", "3️⃣", "4️⃣"];
 const parts = currentOpts.map((w, idx) => {
  return `<span class="summary-item" onclick="openStrokeModal('${w[0]}', '${w[1]}', '${w[2]}')">${emojis[idx]} <b>${w[0]}</b> (${w[1]}): ${w[2]}</span>`;
 });
 return `<div class="options-summary">${parts.join(" &nbsp;|&nbsp; ")}</div>`;
}

function choose(btn,w){
 if(locked)return;locked=true;answered++;const ok=w[0]===current[0];document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.querySelector(".cn").textContent===current[0])b.classList.add("correct")});
 const summaryHtml = getOptionsSummaryHTML();
 if(ok){score+=10;right++;streak++;$("feedback").className="feedback show good";$("feedback").innerHTML=`<b>✓ Chính xác! +10 điểm</b><br>${summaryHtml}`}
 else{streak=0;btn.classList.add("wrong");$("feedback").className="feedback show bad";$("feedback").innerHTML=`<b>✗ Chưa đúng!</b><br>${summaryHtml}`}
 $("score").textContent=score;$("right").textContent=right;$("streak").textContent=streak;$("accuracy").textContent=`Chính xác: ${Math.round(right/answered*100)}%`;$("next").disabled=false;$("next").textContent=index===deck.length-1?"Xem kết quả":"Câu tiếp theo →";
}

function advance(){
 if(!locked){
  const summaryHtml = getOptionsSummaryHTML();
  $("feedback").className="feedback show bad";
  $("feedback").innerHTML=`<b>⏰ Đã bỏ qua!</b><br>${summaryHtml}`;
  answered++;streak=0;$("streak").textContent=0;
  document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.querySelector(".cn").textContent===current[0])b.classList.add("correct")});
  $("next").disabled=false;locked=true;return;
 }
 index++;render();
}

function finish(){$("game").style.display="none";$("result").style.display="block";$("finalscore").textContent=score+" điểm";$("summary").textContent=`Bạn trả lời đúng ${right}/${answered} câu (${answered?Math.round(right/answered*100):0}%). Hãy chơi lại để nhớ từ lâu hơn nhé!`;$("progress").style.width="100%"}

// Hàm ẩn toàn bộ trước, sau đó chạy animation tuần tự từng chữ một
function playSequentialAnimation(writers, index = 0) {
 if (index === 0) {
  writers.forEach(w => w.hideCharacter());
 }
 if (index >= writers.length) return;
 writers[index].animateCharacter({
  onComplete: () => {
   playSequentialAnimation(writers, index + 1);
  }
 });
}

// Modal & Hanzi Writer functions
function openStrokeModal(chineseStr, pinyin, meaning) {
 $("modalHanziTitle").textContent = `${chineseStr} — ${meaning}`;
 $("modalHanziPy").textContent = `Pinyin: ${pinyin}`;
 
 const container = $("writerContainer");
 container.innerHTML = "";
 activeWriters = [];

 // Tạo SVG box cho từng ký tự trong từ
 for (let char of chineseStr) {
  const box = document.createElement("div");
  box.className = "writer-box";
  const targetId = "writer-" + Math.random().toString(36).substr(2, 9);
  box.innerHTML = `<div id="${targetId}"></div>`;
  container.appendChild(box);

  const writer = HanziWriter.create(targetId, char, {
   width: 110,
   height: 110,
   padding: 5,
   showOutline: true,
   strokeAnimationSpeed: 1.2,
   delayBetweenStrokes: 250,
   strokeColor: '#1d4ed8',
   radicalColor: '#16a34a'
  });
  activeWriters.push(writer);
 }

 // Ẩn và bắt đầu chạy tuần tự từ chữ đầu tiên
 playSequentialAnimation(activeWriters, 0);

 $("strokeModal").classList.add("show");
}

function closeStrokeModal() {
 $("strokeModal").classList.remove("show");
}

$("closeModal").onclick = closeStrokeModal;
$("strokeModal").onclick = (e) => { if(e.target === $("strokeModal")) closeStrokeModal(); };

$("animateBtn").onclick = () => {
 playSequentialAnimation(activeWriters, 0);
};

$("quizBtn").onclick = () => {
 activeWriters.forEach(writer => {
  writer.quiz();
 });
};

$("next").onclick=()=>{index++;render()};$("skip").onclick=advance;$("again").onclick=start;$("count").onchange=start;start();
</script>
</body>
</html>
